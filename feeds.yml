# =============================================================================
# BLAKE'S DAILY NEWS — the only file you need to edit
# =============================================================================
#
# This file decides what shows up on the page. You do not need to touch any
# other file.
#
# HOW TO ADD A NEWS SOURCE
#   1. Find the section it belongs in (National, Business, and so on).
#   2. Copy one of the "- name / enabled / url / max_items" blocks.
#   3. Paste it under "sources:" in that section.
#   4. Change the name, paste the RSS or Atom web address into url,
#      and set max_items (how many headlines to keep from that source).
#
# HOW TO REMOVE A NEWS SOURCE
#   Change "enabled: yes" to "enabled: no" under that source.
#   Leave the rest in place so you can turn it back on later.
#   You can also delete the whole block if you are sure.
#
# HOW TO ADD OR REMOVE A KEYWORD
#   block_keywords: a headline that contains one of these is skipped.
#   boost_keywords: a headline that contains one of these is listed higher
#   and has a better chance of becoming the big top story.
#   Add a new line starting with "  - " or delete a line you do not want.
#   Matching ignores capital letters. "Tampa" and "tampa" are the same.
#
# HOW TO KEEP A SECTION ON TOPIC
#   Under a section you can add skip_url_parts and skip_keywords.
#   skip_url_parts: the story is skipped when its link, or the feed's
#     category, contains that text. /sports/ hides a sports link.
#     /entertainment/ hides a celebrity page.
#   skip_keywords: the story is skipped when the headline contains the phrase.
#   require_keywords: on a mixed feed, the headline or link has to contain
#     one of these phrases or the story is left off. A team site can set
#     require_match: no, because every story there is already that team.
#
# THE BIG TOP HEADLINE
#   The page picks the story that shows up in the most different sources.
#   Words in boost_keywords give that story an extra lift, so Tampa Bay,
#   Florida, the Bucs, and markets can outrank a one-off national item.
#
# THE SIREN
#   A spinning red light above the top headline, for a truly huge story only.
#   siren_override (with or without quotes):
#     auto  normal rule (this is the default)
#     on    force the light on
#     off   force the light off
#   On auto, the top story must contain a siren_keywords phrase AND be
#   carried by siren_min_sources different outlets in the last
#   siren_max_age_hours. Ordinary news does not light it.
#   With siren_override set to on, you can also set siren_headline and
#   siren_url to choose the line. Leave those two out to keep the real
#   top story.
#
# After you save this file on GitHub, the site rebuilds by itself.
# =============================================================================

site:
  # Words at the top of the page. Keep the quotes.
  title: "BLAKE'S DAILY NEWS"
  subtitle: "Tampa Bay"

  # Headlines older than this many hours are left off the page.
  max_age_hours: 36

  # How many headlines sit in the short centered list under the big story.
  splash_count: 8

  # How many of those centered headlines are shown in red.
  red_splash: 2

  # How many links at the top of each section are shown in red.
  red_per_section: 2

  # Upper limit on headlines (the big story, the centered list, and the
  # columns combined). If the feeds run long, the oldest ordinary links
  # are dropped first so the page stays about this size.
  # Politics is its own full column, so the cap sits above the old 85.
  max_headlines: 120

  # Siren. Leave this on auto. See the note at the top of this file.
  # Quotes keep YAML from reading on/off as yes/no. auto, on, and off all work.
  siren_override: "auto"
  siren_min_sources: 8
  siren_max_age_hours: 6
  # Only used when siren_override is on. Uncomment to force a specific line:
  # siren_headline: "PRESIDENT RESIGNS"
  # siren_url: "https://example.com/the-story"

# Headlines containing any of these phrases are skipped.
# Delete a line to stop blocking that phrase. Add a line to block a new one.
# Use a real word or phrase. A tiny fragment will hide too many stories.
block_keywords:
  - horoscope
  - lottery
  - crossword
  - coupon code
  - sponsored content
  - advertorial
  - gift guide
  - "you won't believe"

# These phrases lift a story toward the top of its section and toward
# the big headline. Add anything you want to see more of.
boost_keywords:
  - tampa
  - tampa bay
  - st. petersburg
  - st petersburg
  - clearwater
  - hillsborough
  - pinellas
  - pasco
  - hernando
  - sarasota
  - florida
  - buccaneers
  - bucs
  - bulls
  - usf
  - interest rate
  - federal reserve
  - inflation
  - recession
  - stock market
  - wall street
  - mortgage
  - social security
  - retirement
  - tax cut
  - taxes
  - hurricane

# Phrases that can light the siren. The top story must contain one of these
# AND be covered by siren_min_sources outlets in the last siren_max_age_hours.
# Add a line to watch for another kind of huge story. Delete a line to ignore it.
siren_keywords:
  - assassinated
  - assassination
  - killed
  - dies
  - dead at
  - elected president
  - wins presidency
  - wins the presidency
  - declares war
  - declaration of war
  - war declared
  - terror attack
  - terrorist attack
  - resigns
  - impeached
  - martial law
  - nuclear

# -----------------------------------------------------------------------------
# SECTIONS
# column: 1 is the left column, 2 is the middle, 3 is the right.
# On a phone they stack in that same order: 1, then 2, then 3.
# To move a section, change its column number.
# max_items is the most headlines to take from that one source (newest first).
# -----------------------------------------------------------------------------
sections:
  # Column 1 is the left column and the first column on a phone.
  - name: Politics
    column: 1
    # Sports, celebrity, and foreign-desk links stay out of this column.
    skip_url_parts:
      - /sports/
      - /sport/
      - /entertainment/
      - /celebrity/
      - /europe/
    sources:
      - name: Fox News Politics
        enabled: yes
        url: "https://moxie.foxnews.com/google-publisher/politics.xml"
        max_items: 3

      - name: New York Post Politics
        enabled: yes
        url: "https://nypost.com/politics/feed/"
        max_items: 3

      # The Examiner's politics-only feed had one fresh story.
      # The main feed is politics and had a full set.
      - name: Washington Examiner
        enabled: yes
        url: "https://www.washingtonexaminer.com/feed/"
        max_items: 2

      - name: Daily Caller
        enabled: yes
        url: "https://dailycaller.com/feed/"
        max_items: 3

      - name: Townhall
        enabled: yes
        url: "https://townhall.com/tipsheet/feed"
        max_items: 2

      - name: Breitbart Politics
        enabled: yes
        url: "https://www.breitbart.com/politics/feed/"
        max_items: 2

      # Reachable, but often only one story in a 36-hour window.
      - name: The Federalist
        enabled: yes
        url: "https://thefederalist.com/feed/"
        max_items: 2

      - name: National Review
        enabled: yes
        url: "https://www.nationalreview.com/feed/"
        max_items: 2

      - name: Daily Wire
        enabled: yes
        url: "https://www.dailywire.com/feeds/rss.xml"
        max_items: 2

      - name: Just the News
        enabled: yes
        url: "https://justthenews.com/rss.xml"
        max_items: 2

      - name: RealClearPolitics
        enabled: yes
        url: "https://www.realclearpolitics.com/index.xml"
        max_items: 2

      - name: The Hill
        enabled: yes
        url: "https://thehill.com/homenews/feed/"
        max_items: 3

      # Axios does not publish a politics-only feed. This Google News
      # feed is limited to politics stories on axios.com.
      - name: Axios
        enabled: yes
        url: "https://news.google.com/rss/search?q=site:axios.com+politics+when:1d&hl=en-US&gl=US&ceid=US:en"
        max_items: 3
        strip_publisher_suffix: yes

      # politico.com's own RSS answers "forbidden." This Google News feed
      # is limited to stories on politico.com.
      - name: Politico
        enabled: yes
        url: "https://news.google.com/rss/search?q=site:politico.com+when:1d&hl=en-US&gl=US&ceid=US:en"
        max_items: 3
        strip_publisher_suffix: yes

  - name: National
    column: 3
    # Straight news. Politics has its own column.
    skip_url_parts:
      - /sports/
      - /sport/
      - /entertainment/
      - /celebrity/
    skip_keywords:
      - nfl
      - nba
      - mlb
      - nhl
      - ncaa
      - pga
      - qb
      - lb
      - linebacker
      - quarterback
      - presidents cup
      - touchdown
      - home run
      - world series
      - super bowl
      - college football
      - march madness
      - stanley cup
      - world cup
      - premier league
      - mets
      - yankees
      - raiders
      - astros
      - dodgers
      - mariners
      - red sox
      - white sox
      - new york jets
    sources:
      - name: Fox News US
        enabled: yes
        url: "https://moxie.foxnews.com/google-publisher/us.xml"
        max_items: 4

      - name: BBC World
        enabled: yes
        url: "https://feeds.bbci.co.uk/news/world/rss.xml"
        max_items: 4

      # AP shut its public RSS feed. This Google News feed only includes
      # stories published on apnews.com. Google's link opens the AP story.
      - name: AP News
        enabled: yes
        url: "https://news.google.com/rss/search?q=site:apnews.com+when:1d&hl=en-US&gl=US&ceid=US:en"
        max_items: 4
        strip_publisher_suffix: yes

      # Reuters shut its public RSS feed. Same idea as AP, limited to reuters.com.
      - name: Reuters
        enabled: yes
        url: "https://news.google.com/rss/search?q=site:reuters.com+when:1d&hl=en-US&gl=US&ceid=US:en"
        max_items: 4
        strip_publisher_suffix: yes

  - name: Business & Markets
    column: 2
    # A markets roundup sometimes links a game story. Leave those for Sports.
    skip_url_parts:
      - /sports/
      - /sport/
    sources:
      - name: CNBC
        enabled: yes
        url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
        max_items: 5

      - name: MarketWatch
        enabled: yes
        url: "https://feeds.marketwatch.com/marketwatch/topstories/"
        max_items: 4

      - name: Bloomberg Markets
        enabled: yes
        url: "https://feeds.bloomberg.com/markets/news.rss"
        max_items: 4

      # The main Yahoo Finance news feed was stuck on older stories.
      # This address is Yahoo's live market-headline feed.
      - name: Yahoo Finance
        enabled: yes
        url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=%5EGSPC&region=US&lang=en-US"
        max_items: 4

      - name: Seeking Alpha
        enabled: yes
        url: "https://seekingalpha.com/market_currents.xml"
        max_items: 3

  - name: Tampa Bay & Florida
    column: 2
    # Local sports links belong in the Sports column.
    skip_url_parts:
      - /sports/
      - /sport/
    sources:
      # tampabay.com/feed/ no longer exists. This is the Times' working feed.
      - name: Tampa Bay Times
        enabled: yes
        url: "https://www.tampabay.com/arc/outboundfeeds/rss/category/news/?outputType=xml"
        max_items: 6

      # fox13news.com/feed is a dead link. This is the station's local-news feed.
      - name: Fox 13 Tampa Bay
        enabled: yes
        url: "https://www.fox13news.com/rss/category/local-news"
        max_items: 5

      - name: WFLA News Channel 8
        enabled: yes
        url: "https://www.wfla.com/news/feed/"
        max_items: 5

      # floridapolitics.com/feed/ answers "403 Forbidden" to this script.
      # This Google News feed only includes that site's stories.
      - name: Florida Politics
        enabled: yes
        url: "https://news.google.com/rss/search?q=site:floridapolitics.com+when:2d&hl=en-US&gl=US&ceid=US:en"
        max_items: 5
        strip_publisher_suffix: yes

  - name: Sports
    column: 3
    # Tampa Bay teams only. A mixed feed (the Times) has to mention one
    # of these. Team sites are already only that team, so they set
    # require_match: no. "5 Notes Against the Vikings" on the Bucs site
    # would otherwise be dropped for not saying "Bucs."
    require_keywords:
      - bucs
      - buccaneers
      - usf
      - bulls
      - south florida
      - rays
      - lightning
      - tampa
    sources:
      - name: Tampa Bay Buccaneers
        enabled: yes
        url: "https://www.buccaneers.com/rss/news"
        max_items: 4
        require_match: no

      - name: Pewter Report
        enabled: yes
        url: "https://www.pewterreport.com/feed/"
        max_items: 3
        require_match: no

      - name: USF Bulls Football
        enabled: yes
        url: "https://gousfbulls.com/rss?path=football"
        max_items: 4
        require_match: no

      - name: Tampa Bay Rays
        enabled: yes
        url: "https://www.mlb.com/rays/feeds/news/rss.xml"
        max_items: 3
        require_match: no

      # The Lightning's own NHL feed came back empty.
      # Raw Charge is a Lightning news site and it is updating.
      - name: Tampa Bay Lightning
        enabled: yes
        url: "https://www.rawcharge.com/rss/index.xml"
        max_items: 3
        require_match: no

      - name: Tampa Bay Times Sports
        enabled: yes
        url: "https://www.tampabay.com/arc/outboundfeeds/rss/category/sports/?outputType=xml"
        max_items: 6
        require_match: yes

  - name: Tech & Odd
    column: 3
    skip_url_parts:
      - /sports/
      - /sport/
    sources:
      - name: New York Post Tech
        enabled: yes
        url: "https://nypost.com/tech/feed/"
        max_items: 3

      - name: Fox News Tech
        enabled: yes
        url: "https://moxie.foxnews.com/google-publisher/tech.xml"
        max_items: 3

      - name: The Verge
        enabled: yes
        url: "https://www.theverge.com/rss/index.xml"
        max_items: 3

      - name: New York Post Weird
        enabled: yes
        url: "https://nypost.com/weird-but-true/feed/"
        max_items: 2
