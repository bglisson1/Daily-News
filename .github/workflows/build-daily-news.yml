# Rebuilds the page and publishes it to GitHub Pages.
# One broken news feed does not fail this workflow. build.py skips that feed
# and keeps going. A broken feeds.yml file will fail the run on purpose, so
# a typo is visible in the Actions log.

name: Build daily news

on:
  schedule:
    # GitHub runs these clocks in UTC and does not shift for daylight saving.
    # Eastern Daylight Time (EDT, March–November) is UTC-4.
    # Eastern Standard Time (EST, November–March) is UTC-5.
    #
    # 10:00 UTC = 6:00 AM EDT / 5:00 AM EST
    - cron: "0 10 * * *"
    # 15:30 UTC = 11:30 AM EDT / 10:30 AM EST
    - cron: "30 15 * * *"
    # 20:30 UTC = 4:30 PM EDT / 3:30 PM EST
    - cron: "30 20 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the page
        run: python build.py

      - name: Stage the page for GitHub Pages
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub turns off scheduled workflows on a public repository after 60 days
  # with no commit. This job keeps the schedule switched on. It uses the
  # built-in GITHUB_TOKEN only. A news feed being down does not affect it,
  # and a problem here does not block the page deploy above.
  keepalive:
    name: Keep the schedule turned on
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep scheduled updates enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Ask GitHub to mark this workflow active. Safe to call when it
          # already is. This is the same switch as Actions → Enable workflow.
          gh api -X PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-daily-news.yml/enable"
          echo "Schedule switch is on."

          # A commit is what GitHub counts as activity. Skip it while the
          # repository is fresh, so ordinary news updates stay out of the
          # history. 45 days is inside the 60-day cutoff.
          last="$(git log -1 --format=%ct)"
          now="$(date +%s)"
          age_days="$(( (now - last) / 86400 ))"
          echo "Last commit was ${age_days} days ago."
          if [ "${age_days}" -lt 45 ]; then
            echo "No keepalive commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          cat > .keepalive << EOF
          # Touched automatically so GitHub does not turn off the scheduled update.
          # You can ignore this file.
          $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          git add .keepalive
          git commit -m "Keep scheduled updates enabled"
          git push origin HEAD:main
          echo "Saved .keepalive so the schedule stays on."
